name: Unit testing feature branches

on:
  push:
    branches:
    - 'feature/**'

jobs:
  build:
    name: "Run unit tests"

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        server-id: github
        cache: 'maven'
    
    - name: Build with Maven
      run: ./mvnw clean test 