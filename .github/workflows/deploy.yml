name: Integration test and Docker publish

on:
  push:
    branches:
    - main
    - 'ci/**'

jobs:
  test:
    uses: ./.github/workflows/integration-test.yml
    
    permissions:
      contents: read
      packages: write

  build:
    name: "Build the application"
    needs: test   # Ensures the build job runs only if the test job is successful

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        server-id: github
        cache: 'maven'
    
    - name: Build with maven
      run: ./mvnw clean package verify

    - name: Upload artifact for Docker job
      uses: actions/upload-artifact@v4
      with:
        name: java-app
        path: '${{ github.workspace }}/target/*.jar'

  docker:
    name: "Build docker image"
    
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code # Required for the DockerFile
        uses: actions/checkout@v4

      - name: Download artifact from maven job
        uses: actions/download-artifact@v4
        with:
          name: java-app
      
      - name: Logging in to Docker
        run: docker login ghcr.io -u adaz008 -p ${{ github.token }}

      - name: Build the Docker image
        run: docker build . -t ghcr.io/adaz008/cubix/1/optional/app:springboot

      - name: Publishing the Docker image
        run: docker push ghcr.io/adaz008/cubix/1/optional/app:springboot

    